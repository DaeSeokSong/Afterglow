<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인터뷰 — DICOM→NRRD 변환 및 검수 프로세스</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f4f5f7;
      color: #1a1a2e;
      padding: 40px 20px 80px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 32px;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
    header .meta { font-size: 0.82rem; color: #a0a8c0; line-height: 1.8; }
    header .meta span { margin-right: 20px; }
    header .guide {
      margin-top: 14px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.82rem;
      line-height: 1.7;
      color: #c8d0e8;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
    .card.declined {
      opacity: 0.55;
      background: #f9f9fb;
    }

    .q-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .q-num {
      background: #1a1a2e;
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 6px;
      padding: 3px 9px;
      white-space: nowrap;
      margin-top: 2px;
    }
    .q-title { font-size: 1rem; font-weight: 700; line-height: 1.5; }
    .q-id { font-size: 0.72rem; color: #aaa; font-family: monospace; margin-top: 4px; }

    .q-body {
      font-size: 0.88rem;
      color: #444;
      line-height: 1.75;
      margin-bottom: 18px;
      padding-left: 4px;
    }
    .q-body code {
      background: #f0f0f5;
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 0.84rem;
      color: #333;
    }

    .decline-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.84rem;
      color: #666;
      cursor: pointer;
      user-select: none;
    }
    .decline-row input[type="checkbox"] {
      width: 17px; height: 17px;
      accent-color: #e74c3c;
      cursor: pointer;
      flex-shrink: 0;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      border: 1.5px solid #e0e0e8;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.88rem;
      font-family: inherit;
      color: #1a1a2e;
      resize: vertical;
      line-height: 1.7;
      transition: border-color 0.15s, background 0.15s;
      outline: none;
    }
    textarea:focus { border-color: #1a1a2e; }
    textarea:disabled {
      background: #f4f5f7;
      color: #bbb;
      cursor: not-allowed;
      border-color: #e8e8ec;
    }

    .actions {
      position: sticky;
      bottom: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.97); }

    .btn-export {
      background: #1a1a2e;
      color: #fff;
      box-shadow: 0 4px 14px rgba(26,26,46,0.3);
    }
    .btn-export:hover { opacity: 0.88; }

    .btn-preview {
      background: #fff;
      color: #1a1a2e;
      border: 1.5px solid #ccc;
    }
    .btn-preview:hover { background: #f4f5f7; }

    .btn-reset {
      background: #fff;
      color: #e74c3c;
      border: 1.5px solid #e74c3c;
    }
    .btn-reset:hover { background: #fff5f5; }

    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a1a2e;
      color: #fff;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.88rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .progress-bar {
      height: 4px;
      background: #e8e8ec;
      border-radius: 2px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #1a1a2e;
      border-radius: 2px;
      transition: width 0.3s;
    }
    .progress-label {
      font-size: 0.78rem;
      color: #888;
      text-align: right;
      margin-top: -22px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>DICOM → NRRD 변환 및 검수 프로세스 인터뷰</h1>
    <div class="meta">
      <span>✦ 작성자: 이영석</span>
      <span>인터뷰어: 송대석</span>
      <span>세션: 001-dicom-nrrd-inspection</span>
    </div>
    <div class="guide">
      각 질문에 자유롭게 답변해 주세요.<br>
      실제로 하지 않거나 해당 없는 항목은 <strong>해당 없음</strong>에 체크하고 넘어가시면 됩니다.<br>
      작성 내용은 브라우저에 <strong>자동 저장</strong>되어 닫았다 열어도 이어서 작성할 수 있습니다.<br>
      작성 완료 후 <strong>답변 내보내기</strong> 버튼을 눌러 JSON 파일을 저장해 주세요.
    </div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 11 완료</div>

  <form id="interviewForm"></form>

  <div class="actions">
    <span id="saveStatus" style="font-size:0.78rem;color:#aaa;align-self:center;margin-right:auto;"></span>
    <button type="button" class="btn-reset" onclick="resetAll()">초기화</button>
    <button type="button" class="btn-preview" onclick="previewAnswers()">미리보기</button>
    <button type="button" class="btn-export" onclick="exportAnswers()">답변 내보내기 (JSON)</button>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const QUESTIONS = [
  {
    id: "q-d787d7d3-c6e9-40b0-b8cb-f5b96caa075e",
    num: "Q1",
    title: "parse.py 실행 전 사전 확인 사항",
    body: `DICOM 데이터를 받았을 때 <code>parse.py</code> 실행 전에 먼저 확인하는 것들이 있나요?<br>데이터 구조나 사전 체크 포인트가 있으면 알려주세요.`
  },
  {
    id: "q-ce6d1ffe-8c9d-4546-bdb1-fdd552ecc620",
    num: "Q2",
    title: "picks.json summary 이상 판단 기준",
    body: `<code>picks.json</code> 결과에서 summary를 보고 이상하다고 판단하는 기준이 있나요?<br><code>total_legs</code>나 <code>by_region</code> 수치에서 뭔가 맞지 않으면 어떤 경우인지요.`
  },
  {
    id: "q-c1ae09a6-fcc1-4094-bd0b-759be6312084",
    num: "Q3",
    title: "전체 검수 작업 순서",
    body: `실제 검수 시 전체 작업 순서가 어떻게 되나요?<br><code>parse → visualize → export</code> 각 단계에서 무엇을 먼저 보고, 문제가 없으면 다음 단계로 넘어가는 흐름을 구체적으로 알려주세요.`
  },
  {
    id: "q-2508f01b-7195-4a07-b03f-e71d1c1295a7",
    num: "Q4",
    title: "vis_part / vis_align_AP / vis_align_LA 체크 포인트",
    body: `<code>visualize_validation.py</code> 실행 후 <code>vis_part</code>, <code>vis_align_AP</code>, <code>vis_align_LA</code> 세 가지를 보는 순서와<br>각각에서 체크하는 포인트가 뭔가요?`
  },
  {
    id: "q-11679d90-b031-4721-8391-9006ddca3bc4",
    num: "Q5",
    title: "vis_part 부위 오분류 판단 기준",
    body: `<code>vis_part</code>에서 부위(hip/knee/ankle)가 잘못 분류됐다고 판단하는 기준은 무엇인가요?<br>실제로 자주 발생하는 패턴이 있었나요?`
  },
  {
    id: "q-100583a6-7bef-48b1-8417-a9da97a6c94a",
    num: "Q6",
    title: "vis_align_AP/LA 정렬 이상 판단 기준",
    body: `<code>vis_align_AP/LA</code>에서 정렬이 이상하다고 판단하는 기준은 무엇인가요?<br>bar 정렬 확인 시 어느 정도 오차까지 허용하셨나요?`
  },
  {
    id: "q-284b5c14-9d34-4a76-ac0c-9c3955801476",
    num: "Q7",
    title: "partially_dropped_patients 처리 방법",
    body: `<code>drops.json</code>에서 <code>partially_dropped_patients</code>가 있을 때 해당 케이스를 어떻게 처리했나요?<br>그냥 넘어가는 경우와 추가 확인이 필요한 경우를 어떻게 구분했나요?`
  },
  {
    id: "q-0a0e2820-4143-495d-b383-17f5af16924e",
    num: "Q8",
    title: "--raw --patient 옵션 사용 시점",
    body: `검수 중 파싱 오류가 의심될 때 <code>--raw --patient</code> 옵션을 쓰게 되는 구체적인 상황과<br>이후 어떻게 판단했는지 알려주세요.`
  },
  {
    id: "q-2bb35b1d-8c5d-4ff1-ade3-c1e51decf12b",
    num: "Q9",
    title: "병원별 DICOM 특이 케이스",
    body: `병원별로 DICOM 포맷이나 구조가 달라서 생기는 특이 케이스들이 있었나요?<br>SNUH, HLU, JNU 등 각 병원별로 주의해야 할 점이 있으면 알려주세요.`
  },
  {
    id: "q-f775310a-e1b6-4237-af1f-5636da67c19c",
    num: "Q10",
    title: "NRRD export 후 검증 방법",
    body: `<code>export.py</code> 실행 후 NRRD 파일이 올바르게 생성됐는지 확인하는 방법이 있나요?<br>육안 검수 외에 추가로 체크하는 것들이 있었는지요.`
  },
  {
    id: "q-f162e5a0-30f5-47ad-bd65-5853e9a7590c",
    num: "Q11",
    title: "자주 실수하는 부분 / 신규 인계 시 주의사항",
    body: `전체 파이프라인에서 가장 자주 실수하거나 놓치기 쉬운 부분이 어디인가요?<br>새로 이 작업을 하는 사람에게 꼭 전달하고 싶은 주의사항이 있다면요.`
  }
];

const form = document.getElementById("interviewForm");

QUESTIONS.forEach((q, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.id = `card-${i}`;

  card.innerHTML = `
    <div class="q-header">
      <span class="q-num">${q.num}</span>
      <div>
        <div class="q-title">${q.title}</div>
        <div class="q-id">${q.id}</div>
      </div>
    </div>
    <div class="q-body">${q.body}</div>
    <label class="decline-row">
      <input type="checkbox" id="decline-${i}" onchange="toggleDecline(${i})" />
      해당 없음 (건너뜀)
    </label>
    <textarea id="answer-${i}" placeholder="여기에 답변을 입력해 주세요..." oninput="updateProgress()"></textarea>
  `;

  form.appendChild(card);
});

function toggleDecline(i) {
  const cb = document.getElementById(`decline-${i}`);
  const ta = document.getElementById(`answer-${i}`);
  const card = document.getElementById(`card-${i}`);
  ta.disabled = cb.checked;
  if (cb.checked) {
    ta.value = "";
    card.classList.add("declined");
  } else {
    card.classList.remove("declined");
  }
  updateProgress();
  scheduleSave();
}

const STORAGE_KEY = "afterglow_interview_001";
let saveTimer = null;

function saveToStorage() {
  const data = QUESTIONS.map((_, i) => ({
    declined: document.getElementById(`decline-${i}`).checked,
    answer: document.getElementById(`answer-${i}`).value
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  const now = new Date();
  const hm = now.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("saveStatus").textContent = `자동 저장됨 ${hm}`;
}

function loadFromStorage() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    data.forEach((d, i) => {
      const cb = document.getElementById(`decline-${i}`);
      const ta = document.getElementById(`answer-${i}`);
      const card = document.getElementById(`card-${i}`);
      if (!cb || !ta) return;
      cb.checked = d.declined;
      ta.value = d.answer || "";
      ta.disabled = d.declined;
      if (d.declined) card.classList.add("declined");
      else card.classList.remove("declined");
    });
  } catch (e) {}
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToStorage, 600);
}

function resetAll() {
  if (!confirm("모든 작성 내용을 초기화할까요? 이 작업은 되돌릴 수 없습니다.")) return;
  localStorage.removeItem(STORAGE_KEY);
  QUESTIONS.forEach((_, i) => {
    document.getElementById(`decline-${i}`).checked = false;
    const ta = document.getElementById(`answer-${i}`);
    ta.value = "";
    ta.disabled = false;
    document.getElementById(`card-${i}`).classList.remove("declined");
  });
  document.getElementById("saveStatus").textContent = "";
  updateProgress();
  showToast("초기화 완료");
}

function updateProgress() {
  let done = 0;
  QUESTIONS.forEach((_, i) => {
    const declined = document.getElementById(`decline-${i}`).checked;
    const answered = document.getElementById(`answer-${i}`).value.trim().length > 0;
    if (declined || answered) done++;
  });
  const pct = Math.round((done / QUESTIONS.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = `${done} / ${QUESTIONS.length} 완료`;
  scheduleSave();
}

function collectData() {
  return {
    session: "001-dicom-nrrd-inspection",
    interviewee: "이영석",
    interviewer: "송대석",
    exportedAt: new Date().toISOString(),
    answers: QUESTIONS.map((q, i) => {
      const declined = document.getElementById(`decline-${i}`).checked;
      const answer = document.getElementById(`answer-${i}`).value.trim();
      return {
        id: q.id,
        num: q.num,
        title: q.title,
        declined,
        answer: declined ? null : answer
      };
    })
  };
}

function exportAnswers() {
  const data = collectData();
  const unanswered = data.answers.filter(a => !a.declined && !a.answer).length;
  if (unanswered > 0) {
    const ok = confirm(`아직 ${unanswered}개 질문에 답변이 없습니다. 그대로 내보내시겠어요?`);
    if (!ok) return;
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "interview_001_answers.json";
  a.click();
  URL.revokeObjectURL(url);
  showToast("📄 interview_001_answers.json 저장 완료!");
}

function previewAnswers() {
  const data = collectData();
  let text = `=== 인터뷰 답변 미리보기 ===\n\n`;
  data.answers.forEach(a => {
    text += `[${a.num}] ${a.title}\n`;
    text += a.declined ? "→ 해당 없음\n\n" : `→ ${a.answer || "(미작성)"}\n\n`;
  });
  const w = window.open("", "_blank");
  w.document.write(`<pre style="font-family:monospace;padding:24px;white-space:pre-wrap;">${text}</pre>`);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

loadFromStorage();
updateProgress();
</script>
</body>
</html>
